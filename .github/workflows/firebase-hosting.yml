# Необязательное зеркало на Firebase Hosting (адрес вида https://<проект>.web.app).
# Включается, когда в Secrets добавлен FIREBASE_SERVICE_ACCOUNT (JSON сервисного аккаунта).
name: Deploy to Firebase Hosting
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: { HAS_SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT != '''' }}' }
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
        if: env.HAS_SA == 'true'
        env:
          VITE_BASE: /
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_EMAIL_SERAFIM: ${{ vars.VITE_EMAIL_SERAFIM }}
          VITE_EMAIL_KUZMA: ${{ vars.VITE_EMAIL_KUZMA }}
          VITE_EMAIL_ANTON: ${{ vars.VITE_EMAIL_ANTON }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SA == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
